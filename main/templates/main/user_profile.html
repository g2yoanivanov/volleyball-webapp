{% extends 'base.html' %}

{% block title %} {{user.username}} {% endblock %}

{% block content %}
<main class="container-fluid">
    <div class="row mt-5 mx-3 mw-100 h-100">
        <div class="col-lg-4 bg-sec text-center border-main rounded">
            <h2 class="pt-2">{{user.first_name}} {{user.last_name}}</h2>
            <hr class="mt-0" style="color: var(--main-color)">
            <img class="mb-3 rounded" width="260px" height="260px" src="{{user.profile_picture.url}}" />

            <div class="my-2">
                <a class="btn btn-font mt-3 text-decoration-none text-font link-font"
                    href="#">Редактирай профил</a>
            </div>
        </div>
        <div class="col-lg-8 bg-sec text-left border-main rounded pt-3">
            <div class="d-flex row">
                <div class="col-lg-3 d-flex">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="mx-2"
                        viewBox="0 0 16 16">
                        <path
                            d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5zM1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4H1z" />
                    </svg>
                    <h5 class="h6">Потребителско име:</h5>
                </div>
                <div class="col-lg-9">
                    <h5 class="h6">{{user.username}}</h5>
                </div>
            </div>
            <div class="d-flex row">
                <div class="col-lg-3 d-flex">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="mx-2" height="16" widht="16">
                        <path
                            d="M57.7 193l9.4 16.4c8.3 14.5 21.9 25.2 38 29.8L163 255.7c17.2 4.9 29 20.6 29 38.5v39.9c0 11 6.2 21 16 25.9s16 14.9 16 25.9v39c0 15.6 14.9 26.9 29.9 22.6c16.1-4.6 28.6-17.5 32.7-33.8l2.8-11.2c4.2-16.9 15.2-31.4 30.3-40l8.1-4.6c15-8.5 24.2-24.5 24.2-41.7v-8.3c0-12.7-5.1-24.9-14.1-33.9l-3.9-3.9c-9-9-21.2-14.1-33.9-14.1H257c-11.1 0-22.1-2.9-31.8-8.4l-34.5-19.7c-4.3-2.5-7.6-6.5-9.2-11.2c-3.2-9.6 1.1-20 10.2-24.5l5.9-3c6.6-3.3 14.3-3.9 21.3-1.5l23.2 7.7c8.2 2.7 17.2-.4 21.9-7.5c4.7-7 4.2-16.3-1.2-22.8l-13.6-16.3c-10-12-9.9-29.5 .3-41.3l15.7-18.3c8.8-10.3 10.2-25 3.5-36.7l-2.4-4.2c-3.5-.2-6.9-.3-10.4-.3C163.1 48 84.4 108.9 57.7 193zM464 256c0-36.8-9.6-71.4-26.4-101.5L412 164.8c-15.7 6.3-23.8 23.8-18.5 39.8l16.9 50.7c3.5 10.4 12 18.3 22.6 20.9l29.1 7.3c1.2-9 1.8-18.2 1.8-27.5zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256z" />
                    </svg>
                    <h5 class="h6">Дата на раждане:</h5>
                </div>
                <div class="col-lg-9">
                    <h5 class="h6">{{user.birth_date|date:"d.m.Y"}}г.</h5>
                </div>
            </div>
            <div class="d-flex row">
                <div class="col-lg-3 d-flex">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="mx-2" height="16"
                        width="16">
                        <path
                            d="M174.9 494.1c-18.7 18.7-49.1 18.7-67.9 0L14.9 401.9c-18.7-18.7-18.7-49.1 0-67.9l50.7-50.7 48 48c6.2 6.2 16.4 6.2 22.6 0s6.2-16.4 0-22.6l-48-48 41.4-41.4 48 48c6.2 6.2 16.4 6.2 22.6 0s6.2-16.4 0-22.6l-48-48 41.4-41.4 48 48c6.2 6.2 16.4 6.2 22.6 0s6.2-16.4 0-22.6l-48-48 41.4-41.4 48 48c6.2 6.2 16.4 6.2 22.6 0s6.2-16.4 0-22.6l-48-48 50.7-50.7c18.7-18.7 49.1-18.7 67.9 0l92.1 92.1c18.7 18.7 18.7 49.1 0 67.9L174.9 494.1z" />
                    </svg>
                    <h5 class="h6">Любим отбор:</h5>
                </div>
                <div class="col-lg-9">
                    <!--TODO: Favourite team-->
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
