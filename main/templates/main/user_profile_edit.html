{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<main>
    <div class="container-fluid d-flex justify-content-center my-5">
        <div class="d-grid bg-sec rounded">
            <div class="p-2">
                <h2 class="text-center text-font">Редактиране</h2>
                <form class="form-control text-left bg-sec border-sec" method="POST" action=""
                    enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center my-2 row">
                        <div class="col-lg-6">
                            {{form.username|as_crispy_field}}
                        </div>
                    </div>
                    <div class="d-flex justify-content-center my-2 row">
                        <div class="col-lg-6">
                            {{form.first_name|as_crispy_field}}
                        </div>
                        <div class="col-lg-6">
                            {{form.last_name|as_crispy_field}}
                        </div>
                    </div>

                    <div class="d-flex justify-content-center my-2 row">
                        <div class="col-lg-6">
                            <label for="birth_date">Рождена дата*</label>
                            <input class="form-control bg-bg" type="date" required name="birth_date"
                                value="{{user.birth_date|date:'Y-m-d'}}" min="1960-01-01" max="{{now|date:'Y-m-d'}}">
                        </div>
                        <div class="col-lg-6">
                            {{form.email|as_crispy_field}}
                        </div>
                    </div>

                    <div class="d-flex justify-content-center my-2 row">
                        <div class="col-lg-6">
                            {{form.profile_picture|as_crispy_field}}
                        </div>
                    </div>
                    <div class="mt-3">
                        <button class="btn btn-font" type="submit">Редактирай</button>
                    </div>


                </form>
            </div>
        </div>
    </div>
</main>
{% endblock %}
