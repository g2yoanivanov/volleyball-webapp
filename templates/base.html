<!DOCTYPE html>

<head>

    <!--Title-->
    <title>{% block title %}Volleyball App{% endblock %}</title>
</head>

<body>
    <!--Navbar-->
    {% include 'navbar.html' %}

    {% if messages %}
    <div class="card text-white bg-main mb-3 text-center mx-auto mt-5" style="max-width: 25%;">
        <div class="card-body">
            <h5 class="card-title">Грешка!</h5>
            <ul class="messages card-text">
                {% for message in messages %}
                <p class="text-decoration-none">-{{ message }}</p>
                {% endfor %}
            </ul>
        </div>
    </div>
    {% endif %}

    <!--Content-->
    {% block content %}
    {% endblock %}
